<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | TING, TZU-CHEN</title>
    <!-- 引入 Google Fonts 手寫與襯線字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">

    <style>
        /* 基礎重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f2eb;
            /* 使用 CSS 繪製細緻方格紙背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
            color: #555;
        }

        /* 主容器 */
        .portfolio-container {
            position: relative;
            width: 85%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* 頂部年份區塊 */
        .year-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.8rem;
            color: #888;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: -20px;
        }

        .year-line {
            flex-grow: 1;
            height: 1px;
            background-color: #b5b0a6;
            margin: 0 25px;
        }

        /* 主標題 Portfolio */
        .main-title {
            font-family: 'Italianno', cursive;
            font-size: 10rem;
            color: #2b5c92; /* 水彩藍 */
            font-weight: 400;
            text-align: center;
            line-height: 1;
            margin: 10px 0 30px 0;
            text-shadow: 1px 1px 2px rgba(43, 92, 146, 0.2);
            user-select: none;
        }

        /* 中間資訊列（名字與按鈕） */
        .info-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .author-name {
            font-size: 1.1rem;
            color: #5b7c99;
            letter-spacing: 2.5px;
            font-weight: 500;
        }

        /* Graphic Design 磚紅按鈕 */
        .category-badge {
            background-color: #9e4a42; /* 磚紅色 */
            color: #ffffff;
            padding: 8px 22px;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-badge:hover {
            background-color: #833932;
            transform: translateY(-2px);
        }

        /* 底部分類標籤 */
        .nav-tags {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #777;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .nav-tags span {
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-tags span:hover {
            color: #2b5c92;
        }

        .divider {
            color: #ccc;
            font-weight: 300;
        }

        /* 響應式微調 (手機版) */
        @media (max-width: 768px) {
            .main-title {
                font-size: 6rem;
            }
            .year-header {
                font-size: 1.2rem;
            }
            .info-row {
                flex-direction: column;
                gap: 15px;
            }
            .nav-tags {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            .divider {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- 頂部年份與橫線 -->
        <div class="year-header">
            <span>2024</span>
            <div class="year-line"></div>
            <span>2026</span>
        </div>

        <!-- 主標題 -->
        <h1 class="main-title">Portfolio</h1>

        <!-- 名字與標籤按鈕 -->
        <div class="info-row">
            <div class="author-name">TING,TZU-CHEN</div>
            <div class="category-badge">Graphic Design</div>
        </div>

        <!-- 底部導覽分類 -->
        <div class="nav-tags">
            <span>BRAND</span>
            <span class="divider">|</span>
            <span>PACKAGING</span>
            <span class="divider">|</span>
            <span>ADVERTISING</span>
            <span class="divider">|</span>
            <span>MARKETING</span>
            <span class="divider">|</span>
            <span>ART</span>
            <span class="divider">|</span>
            <span>CONCEPT</span>
        </div>
    </div>

</body>
</html>
