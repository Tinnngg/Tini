<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | TING, TZU-CHEN</title>
    <!-- 引入 Google Fonts 的 Source Sans 3 (Variable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 基礎重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Source Sans 3', 'Source Sans Variable', sans-serif;
            background-color: #f5f2eb;
            /* 使用 CSS 繪製細緻方格紙背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
            color: #e6e6e6;
        }

        /* 主容器 */
        .portfolio-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
        }

        /* 頂部年份區塊：Source Sans Variable, Regular (400), 60px */
        .year-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Source Sans 3', 'Source Sans Variable', sans-serif;
            font-size: 55px;
            font-weight: 400; /* Regular */
            color: #888;
            margin-bottom: -10px;
        }

        .year-line {
            flex-grow: 1;
            height: 2px;
            background-color: #b5b0a6;
            margin: 0 30px;
        }

        /* 主標題 Portfolio：Snell Roundhand, Bold (700), 300px */
        .main-title {
            font-family: 'Snell Roundhand', 'Italianno', cursive;
            font-size: 300px;
            font-weight: 700; /* Bold */
            color: #2b5c92; /* 水彩藍 */
            text-align: center;
            line-height: 0.9;
            margin: 10px 0 30px 0;
            text-shadow: 1px 1px 2px rgba(43, 92, 146, 0.15);
            user-select: none;
        }

        /* 中間資訊列 */
        .info-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        /* 名字：Source Sans Variable, Regular (400), 36px */
        .author-name {
            font-family: 'Source Sans 3', 'Source Sans Variable', sans-serif;
            font-size: 30px;
            font-weight: 400; /* Regular */
            color: #5b7c99;
            letter-spacing: 1px;
        }

        /* Graphic Design 磚紅按鈕：Source Sans Variable, Regular (400), 40px */
        .category-badge {
            font-family: 'Source Sans 3', 'Source Sans Variable', sans-serif;
            font-size: 40px;
            font-weight: 400; /* Regular */
            background-color: #9e4a42; /* 磚紅色 */
            color: #ffffff;
            padding: 6px 24px;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1.2;
        }

        .category-badge:hover {
            background-color: #833932;
            transform: translateY(-2px);
        }

        /* 底部分類標籤 */
        .nav-tags {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #777;
            letter-spacing: 2px;
            font-weight: 450;
        }

        .nav-tags span {
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-tags span:hover {
            color: #2b5c92;
        }

        .divider {
            color: #ccc;
            font-weight: 300;
            font-size: 1rem;
        }

        /* 響應式自動縮放 (防止極大字級在小螢幕爆版) */
        @media (max-width: 1024px) {
            .main-title {
                font-size: 180px;
            }
            .year-header {
                font-size: 40px;
            }
            .author-name {
                font-size: 28px;
            }
            .category-badge {
                font-size: 30px;
            }
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 100px;
            }
            .year-header {
                font-size: 24px;
            }
            .info-row {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
            .author-name {
                font-size: 22px;
            }
            .category-badge {
                font-size: 24px;
            }
            .nav-tags {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            .divider {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- 頂部年份與橫線 -->
        <div class="year-header">
            <span>2024</span>
            <div class="year-line"></div>
            <span>2026</span>
        </div>

        <!-- 主標題 -->
        <h1 class="main-title">Portfolio</h1>

        <!-- 名字與標籤按鈕 -->
        <div class="info-row">
            <div class="author-name">TING,TZU-CHEN</div>
            <div class="category-badge">Graphic Design</div>
        </div>

        <!-- 底部導覽分類 -->
        <div class="nav-tags">
            <span>BRAND</span>
            <span class="divider">|</span>
            <span>PACKAGING</span>
            <span class="divider">|</span>
            <span>ADVERTISING</span>
            <span class="divider">|</span>
            <span>MARKETING</span>
            <span class="divider">|</span>
            <span>ART</span>
            <span class="divider">|</span>
            <span>CONCEPT</span>
        </div>
    </div>

</body>
</html>
